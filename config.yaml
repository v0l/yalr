server:
  host: "0.0.0.0"
  port: 3000
  # Admin UI path - change for dev mode (e.g., "./admin/dist" or "/app/admin/dist")
  admin_ui_path: "admin/dist"

database:
  url: "sqlite:llm_router.db?mode=rwc"

# NIP-98 authentication (enabled for testing)
auth:
  enabled: true
  # allowed_pubkeys:
  #   - "your_pubkey_here"

# Anthropic provider behaviour
anthropic:
  # Inject prompt-cache breakpoints (system/tools + growing conversation prefix).
  # On by default; set to false for purely one-shot traffic.
  prompt_cache: true
